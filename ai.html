<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Artificial Maths</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
>

<style>

:root{
  --sidebar-bg:#171717;
  --sidebar-hover:#212121;
  --sidebar-active:#2a2a2a;
  --sidebar-text:#ececec;
  --sidebar-muted:#a3a3a3;
  --sidebar-border:#2d2d2d;

  --main-bg:#ffffff;
  --text:#0d0d0d;
  --muted:#6e6e80;
  --border:#e5e5e5;

  --bubble-user:#f2f2f3;
  --accent:#111111;
  --danger:#e5484d;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Inter,
    ui-sans-serif,
    system-ui,
    sans-serif;

  background:var(--main-bg);
  color:var(--text);
}

button{
  border:0;
  background:none;
  font:inherit;
  cursor:pointer;
  color:inherit;
}

button:disabled{
  cursor:not-allowed;
}

textarea{
  font:inherit;
}

.app{
  height:100vh;
  display:flex;
  overflow:hidden;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:270px;
  flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-text);

  display:flex;
  flex-direction:column;

  padding:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;

  font-weight:650;
  font-size:15px;

  padding:8px 6px 14px;
}

.brand img{
  width:26px;
  height:26px;

  border-radius:7px;

  object-fit:cover;
}

.new-chat-btn{
  display:flex;
  align-items:center;
  gap:10px;

  width:100%;

  padding:11px 12px;

  border:1px solid var(--sidebar-border);
  border-radius:12px;

  text-align:left;
  font-size:14px;
}

.new-chat-btn:hover{
  background:var(--sidebar-hover);
}

.new-chat-btn svg{
  flex-shrink:0;
}

.chat-list{
  flex:1;

  overflow-y:auto;

  margin-top:14px;

  display:flex;
  flex-direction:column;

  gap:2px;
}

.chat-list-label{
  font-size:11px;
  color:var(--sidebar-muted);

  padding:10px 10px 4px;

  text-transform:uppercase;

  letter-spacing:.04em;
}

.chat-item{
  position:relative;

  display:flex;
  align-items:center;

  gap:8px;

  padding:9px 10px;

  border-radius:10px;

  font-size:13.5px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-item:hover{
  background:var(--sidebar-hover);
}

.chat-item.active{
  background:var(--sidebar-active);
}

.chat-item .title{
  flex:1;

  overflow:hidden;
  text-overflow:ellipsis;

  white-space:nowrap;

  text-align:left;
}

.chat-item .delete-btn{
  opacity:0;

  flex-shrink:0;

  padding:3px;

  border-radius:6px;

  color:var(--sidebar-muted);
}

.chat-item:hover .delete-btn{
  opacity:1;
}

.chat-item .delete-btn:hover{
  color:var(--danger);

  background:rgba(255,255,255,.08);
}

.sidebar-bottom{
  border-top:1px solid var(--sidebar-border);

  padding-top:10px;
  margin-top:8px;
}

.user-row{
  display:flex;
  align-items:center;

  gap:9px;

  padding:8px;

  border-radius:10px;
}

.user-row:hover{
  background:var(--sidebar-hover);
}

.user-row img{
  width:26px;
  height:26px;

  border-radius:50%;

  flex-shrink:0;

  object-fit:cover;
}

.user-row .name{
  flex:1;

  font-size:13px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.user-row .signout-btn{
  color:var(--sidebar-muted);

  padding:4px;

  border-radius:6px;
}

.user-row .signout-btn:hover{
  color:var(--sidebar-text);

  background:rgba(255,255,255,.08);
}


/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;

  display:flex;
  flex-direction:column;

  min-width:0;

  position:relative;
}

.chat-scroll{
  flex:1;

  overflow-y:auto;
}

.messages{
  max-width:768px;

  margin:0 auto;

  padding:40px 22px 170px;

  min-height:100%;
}

.empty-state{
  text-align:center;

  margin-top:16vh;
}

.empty-state h1{
  font-size:30px;

  margin:0 0 8px;

  letter-spacing:-.6px;
}

.empty-state p{
  color:var(--muted);

  margin:0;
}


/* =========================================================
   MESSAGES
========================================================= */

.msg{
  display:flex;

  gap:14px;

  margin:26px 0;

  align-items:flex-start;
}

.msg.user{
  justify-content:flex-end;
}

.avatar{
  width:30px;
  height:30px;

  border-radius:8px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--accent);

  color:#fff;

  font-size:13px;

  font-weight:700;
}

.msg-body{
  max-width:75%;

  min-width:0;
}

.msg.user .msg-body{
  background:var(--bubble-user);

  padding:11px 15px;

  border-radius:18px;
}

.msg.assistant .msg-body{
  padding-top:4px;
}

.msg-images{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:8px;
}

.msg-image{
  width:280px;

  max-width:100%;

  max-height:320px;

  object-fit:contain;

  border-radius:12px;

  display:block;

  background:#f5f5f5;
}

.msg-text{
  line-height:1.65;

  font-size:15.5px;

  white-space:pre-wrap;

  word-wrap:break-word;
}

.msg.assistant .msg-text p{
  margin:0 0 12px;
}

.msg.assistant .msg-text p:last-child{
  margin-bottom:0;
}

.msg.assistant .msg-text pre{
  background:#0d0d0d;

  color:#f2f2f2;

  padding:12px 14px;

  border-radius:10px;

  overflow-x:auto;

  font-size:13px;
}

.msg.assistant .msg-text code{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

.msg.assistant .msg-text :not(pre)>code{
  background:#f0f0f1;

  padding:1px 5px;

  border-radius:5px;
}

.msg.assistant .msg-text ul,
.msg.assistant .msg-text ol{
  margin:0 0 12px;

  padding-left:22px;
}


/* =========================================================
   TYPING
========================================================= */

.typing-dots{
  display:flex;

  gap:4px;

  padding:8px 0;
}

.typing-dots span{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#9b9b9b;

  animation:
    bounce
    1.2s
    infinite
    ease-in-out;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{

  0%,
  80%,
  100%{
    transform:translateY(0);
    opacity:.5;
  }

  40%{
    transform:translateY(-4px);
    opacity:1;
  }

}


/* =========================================================
   COMPOSER
========================================================= */

.composer-wrap{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    14px
    20px
    18px;

  background:
    linear-gradient(
      transparent,
      var(--main-bg) 32%
    );
}

.composer{
  max-width:768px;

  margin:0 auto;

  background:#fff;

  border:1px solid var(--border);

  border-radius:22px;

  box-shadow:
    0 6px 24px
    rgba(0,0,0,.07);
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

.image-preview-container{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  padding:10px 12px 0;
}

.image-preview-item{
  position:relative;

  width:64px;
  height:64px;
}

.image-preview-item img{
  width:64px;
  height:64px;

  object-fit:cover;

  border-radius:10px;

  border:1px solid var(--border);

  display:block;
}

.image-preview-remove{
  position:absolute;

  top:-6px;
  right:-6px;

  width:20px;
  height:20px;

  border-radius:50%;

  background:#111;

  color:#fff;

  font-size:14px;

  line-height:20px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;
}

.image-preview-remove:hover{
  background:var(--danger);
}


/* =========================================================
   COMPOSER ROW
========================================================= */

.composer-row{
  display:flex;

  align-items:flex-end;

  gap:4px;

  padding:6px;
}

.icon-btn{
  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#555;

  flex-shrink:0;
}

.icon-btn:hover{
  background:#f0f0f1;
}

.icon-btn:disabled{
  opacity:.4;
}

.composer textarea{
  flex:1;

  border:0;

  outline:0;

  resize:none;

  min-height:26px;

  max-height:200px;

  padding:9px 6px;

  background:transparent;

  font-size:15.5px;

  line-height:1.4;
}

.send-btn{
  width:34px;
  height:34px;

  border-radius:50%;

  background:#111;

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  margin:2px;
}

.send-btn:disabled{
  opacity:.3;

  cursor:not-allowed;
}

.disclaimer{
  font-size:11.5px;

  color:var(--muted);

  text-align:center;

  margin-top:8px;
}


/* =========================================================
   AUTH
========================================================= */

.auth-overlay{
  position:fixed;

  inset:0;

  background:#fff;

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:50;
}

.auth-overlay.hidden{
  display:none;
}

.auth-card{
  text-align:center;

  padding:40px;

  max-width:340px;
}

.auth-card img{
  width:52px;
  height:52px;

  border-radius:14px;

  margin-bottom:18px;

  object-fit:cover;
}

.auth-card h1{
  font-size:24px;

  margin:0 0 6px;

  letter-spacing:-.5px;
}

.auth-card p{
  color:var(--muted);

  margin:0 0 26px;

  font-size:14.5px;
}

.google-btn{
  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  width:100%;

  padding:12px 16px;

  border:1px solid var(--border);

  border-radius:12px;

  font-size:14.5px;

  font-weight:550;
}

.google-btn:hover{
  background:#f7f7f8;
}

.google-btn:disabled{
  opacity:.6;
}

.auth-status{
  font-size:12.5px;

  color:var(--muted);

  margin-top:16px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    z-index:40;

    transform:translateX(-100%);

    transition:
      transform .2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .messages{
    padding-left:14px;
    padding-right:14px;
  }

  .msg-body{
    max-width:88%;
  }

  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .msg-image{
    width:240px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="brand">

    <img
      src="maths-logo.png"
      alt=""
    >

    Artificial Maths

  </div>


  <button
    class="new-chat-btn"
    id="newChatBtn"
    type="button"
  >

    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M12 5v14"/>
      <path d="M5 12h14"/>
    </svg>

    New chat

  </button>


  <div class="chat-list-label">
    Chats
  </div>


  <div
    class="chat-list"
    id="chatList"
  ></div>


  <div class="sidebar-bottom">

    <div
      class="user-row"
      id="userRow"
    >

      <img
        id="userAvatar"
        alt=""
      >

      <span
        class="name"
        id="userName"
      ></span>


      <button
        class="signout-btn"
        id="signOutBtn"
        type="button"
        title="Sign out"
      >

        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
          />

          <path
            d="M16 17l5-5-5-5"
          />

          <path
            d="M21 12H9"
          />

        </svg>

      </button>

    </div>

  </div>

</aside>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


  <div
    class="chat-scroll"
    id="chatScroll"
  >

    <div
      class="messages"
      id="messages"
    >

      <div
        class="empty-state"
        id="emptyState"
      >

        <h1>
          What can I help you with?
        </h1>

        <p>
          Maths, coding, science, ideas, research and more.
        </p>

      </div>

    </div>

  </div>


  <!-- =====================================================
       COMPOSER
  ====================================================== -->

  <div class="composer-wrap">

    <div class="composer">


      <!-- IMAGE PREVIEWS -->

      <div
        class="image-preview-container"
        id="imagePreview"
        hidden
      ></div>


      <div class="composer-row">


        <!-- ATTACH -->

        <button
          class="icon-btn"
          id="attachBtn"
          type="button"
          title="Attach images"
        >

          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path
              d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
            />

          </svg>

        </button>


        <input
          type="file"
          id="fileInput"
          accept="image/*"
          multiple
          hidden
        >


        <!-- TEXT -->

        <textarea
          id="input"
          rows="1"
          placeholder="Message Artificial Maths..."
        ></textarea>


        <!-- SEND -->

        <button
          class="send-btn"
          id="sendBtn"
          type="button"
          title="Send"
          disabled
        >

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
          >

            <path
              d="M12 19V5"
            />

            <path
              d="M5 12l7-7 7 7"
            />

          </svg>

        </button>


      </div>

    </div>


    <div class="disclaimer">
      AI responses can be inaccurate. Check important information.
    </div>

  </div>


</main>


<!-- =======================================================
     AUTH OVERLAY
======================================================= -->

<div
  class="auth-overlay"
  id="authOverlay"
>

  <div class="auth-card">

    <img
      src="maths-logo.png"
      alt=""
    >

    <h1>
      Artificial Maths
    </h1>

    <p>
      Sign in to start chatting.
    </p>


    <button
      class="google-btn"
      id="googleSignInBtn"
      type="button"
    >

      <svg
        width="18"
        height="18"
        viewBox="0 0 48 48"
      >

        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"
        />

        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 15.6 3 8.4 7.9 6.3 14.7z"
        />

        <path
          fill="#4CAF50"
          d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 27 37 24 37c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C8.3 40 15.5 45 24 45z"
        />

        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.6 5.4C41.5 35.9 45 30.4 45 24c0-1.4-.1-2.5-.4-3.5z"
        />

      </svg>

      Continue with Google

    </button>


    <div
      class="auth-status"
      id="authStatus"
    ></div>

  </div>

</div>


</div>


<!-- =======================================================
     LIBRARIES
======================================================= -->

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


import {
  marked
} from "https://cdn.jsdelivr.net/npm/marked@11/+esm";


import DOMPurify
  from "https://cdn.jsdelivr.net/npm/dompurify@3/+esm";



/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

/*
 * IMPORTANT:
 *
 * SUPABASE_URL and SUPABASE_ANON_KEY MUST belong
 * to the SAME Supabase project.
 *
 * Do NOT use a service_role key here.
 */

const SUPABASE_URL =
  "https://inidxltybmadzgggvpxz.supabase.co";


const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluaWR4bHR5Ym1hZHpnZ2d2cHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjMyOTMsImV4cCI6MjEwMjg5OTI5M30.7yrNe9mk_cj6YPi4adutrKfC0pDZxWLyUcsdvbnkSqY";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


marked.setOptions({
  breaks:true
});


/* =========================================================
   DOM
========================================================= */

const authOverlay =
  document.getElementById(
    "authOverlay"
  );


const authStatus =
  document.getElementById(
    "authStatus"
  );


const googleSignInBtn =
  document.getElementById(
    "googleSignInBtn"
  );


const signOutBtn =
  document.getElementById(
    "signOutBtn"
  );


const userAvatar =
  document.getElementById(
    "userAvatar"
  );


const userName =
  document.getElementById(
    "userName"
  );


const newChatBtn =
  document.getElementById(
    "newChatBtn"
  );


const chatList =
  document.getElementById(
    "chatList"
  );


const messagesEl =
  document.getElementById(
    "messages"
  );


const emptyState =
  document.getElementById(
    "emptyState"
  );


const chatScroll =
  document.getElementById(
    "chatScroll"
  );


const input =
  document.getElementById(
    "input"
  );


const sendBtn =
  document.getElementById(
    "sendBtn"
  );


const attachBtn =
  document.getElementById(
    "attachBtn"
  );


const fileInput =
  document.getElementById(
    "fileInput"
  );


const imagePreview =
  document.getElementById(
    "imagePreview"
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let chats = [];

let currentChat = null;

let currentMessages = [];

let pendingImages = [];

let sending = false;


/* =========================================================
   AUTH
========================================================= */

googleSignInBtn.addEventListener(
  "click",
  async () => {

    authStatus.textContent =
      "Redirecting to Google…";

    googleSignInBtn.disabled =
      true;

    try {

      const {
        error
      } =
        await supabase.auth.signInWithOAuth({
          provider:"google",

          options:{
            redirectTo:
              window.location.href
          }
        });


      if (error) {
        throw error;
      }

    } catch (error) {

      console.error(error);

      authStatus.textContent =
        error.message ||
        "Could not sign in.";

      googleSignInBtn.disabled =
        false;
    }

  }
);


signOutBtn.addEventListener(
  "click",
  async () => {

    await supabase.auth.signOut();

  }
);


/* =========================================================
   SESSION
========================================================= */

async function handleSession(
  session
){

  currentUser =
    session?.user || null;


  if (currentUser) {

    authOverlay.classList.add(
      "hidden"
    );


    userName.textContent =
      currentUser.user_metadata
        ?.full_name ||
      currentUser.email ||
      "Account";


    const avatar =
      currentUser.user_metadata
        ?.avatar_url;


    if (avatar) {

      userAvatar.src =
        avatar;

    } else {

      userAvatar.removeAttribute(
        "src"
      );

    }


    await loadChats();

  } else {

    authOverlay.classList.remove(
      "hidden"
    );


    authStatus.textContent =
      "";


    chats = [];

    currentChat = null;

    currentMessages = [];

    clearPendingImages();

    renderChatList();

    renderMessages();

  }

}

} =

await handleSession(

);


supabase.auth.onAuthStateChange(

/* =========================================================
   LOAD CHATS
========================================================= */

async function loadChats(){

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await supabase
      .from("am_chats")
      .select("*")
      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  if (error) {

    console.error(
      "Failed to load chats:",
      error
    );

    /*
     * 401 usually means the Supabase
     * public key is incorrect.
     */

    if (
      error.code === "401" ||
      error.status === 401
    ) {

      authStatus.textContent =
        "Supabase authentication failed. Check your Supabase Publishable/anon key.";

    }

    return;
  }


  chats =
    data || [];


  renderChatList();


  if (
    chats.length &&
    !currentChat
  ) {

    await selectChat(
      chats[0]
    );

  } else if (
    !chats.length
  ) {

    currentChat = null;

    currentMessages = [];

    renderMessages();

  }

}


/* =========================================================
   CHAT LIST
========================================================= */

function renderChatList(){

  chatList.innerHTML = "";


  for (
    const chat of chats
  ){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "chat-item" +
      (
        currentChat &&
        currentChat.id === chat.id
          ? " active"
          : ""
      );


    const title =
      document.createElement(
        "span"
      );


    title.className =
      "title";


    title.textContent =
      chat.title ||
      "New chat";


    const del =
      document.createElement(
        "button"
      );


    del.className =
      "delete-btn";


    del.type =
      "button";


    del.title =
      "Delete chat";


    del.innerHTML =
      `
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
      `;


    del.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        deleteChat(chat);

      }
    );


    item.appendChild(
      title
    );

    item.appendChild(
      del
    );


    item.addEventListener(
      "click",
      () => {

        selectChat(
          chat
        );

      }
    );


    chatList.appendChild(
      item
    );

  }

}


/* =========================================================
   SELECT CHAT
========================================================= */

async function selectChat(
  chat
){

  currentChat =
    chat;


  renderChatList();


  const {
    data,
    error
  } =
    await supabase
      .from("am_messages")
      .select("*")
      .eq(
        "chat_id",
        chat.id
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if (error) {

    console.error(
      "Failed to load messages:",
      error
    );

    return;
  }


  currentMessages =
    data || [];


  renderMessages();

}


/* =========================================================
   CREATE CHAT
========================================================= */

async function createNewChat(){

  if (!currentUser) {

    console.error(
      "Cannot create chat without a user."
    );

    return null;

  }


  const {
    data,
    error
  } =
    await supabase
      .from("am_chats")
      .insert({
        user_id:
          currentUser.id,

        title:
          "New chat"
      })
      .select()
      .single();


  if (error) {

    console.error(
      "Failed to create chat:",
      error
    );

    alert(
      "Could not create chat: " +
      (
        error.message ||
        "Unknown error"
      )
    );

    return null;
  }


  chats.unshift(
    data
  );


  currentChat =
    data;


  currentMessages =
    [];


  renderChatList();

  renderMessages();


  return data;

}


/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(
  chat
){

  if (
    !confirm(
      "Delete this chat?"
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabase
      .from("am_chats")
      .delete()
      .eq(
        "id",
        chat.id
      );


  if (error) {

    console.error(
      "Failed to delete chat:",
      error
    );

    alert(
      "Could not delete chat: " +
      error.message
    );

    return;

  }


  chats =
    chats.filter(
      c =>
        c.id !== chat.id
    );


  if (
    currentChat &&
    currentChat.id === chat.id
  ){

    currentChat =
      null;

    currentMessages =
      [];


    if (chats.length) {

      await selectChat(
        chats[0]
      );

    } else {

      renderMessages();

    }

  }


  renderChatList();

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(){

  messagesEl.innerHTML = "";


  if (
    !currentMessages.length
  ){

    messagesEl.appendChild(
      emptyState
    );


    emptyState.style.display =
      "";


    return;

  }


  emptyState.style.display =
    "none";


  for (
    const message of currentMessages
  ){

    appendMessageEl(
      message.role,
      message.content,
      message.image_url,
      message.image_urls
    );

  }


  scrollToBottom();

}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessageEl(
  role,
  content,
  imageUrl,
  imageUrls = []
){

  const wrap =
    document.createElement(
      "div"
    );


  wrap.className =
    "msg " +
    role;


  if (
    role === "assistant"
  ){

    const avatar =
      document.createElement(
        "div"
      );


    avatar.className =
      "avatar";


    avatar.textContent =
      "AM";


    wrap.appendChild(
      avatar
    );

  }


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "msg-body";


  /*
   * Support:
   *
   * image_urls[]
   *
   * and old:
   *
   * image_url
   */

  const urls = [];


  if (
    Array.isArray(
      imageUrls
    )
  ){

    urls.push(
      ...imageUrls
    );

  }


  if (
    imageUrl &&
    !urls.includes(
      imageUrl
    )
  ){

    urls.push(
      imageUrl
    );

  }


  if (
    urls.length
  ){

    const images =
      document.createElement(
        "div"
      );


    images.className =
      "msg-images";


    for (
      const url of urls
    ){

      if (!url) {
        continue;
      }


      const img =
        document.createElement(
          "img"
        );


      img.className =
        "msg-image";


      img.src =
        url;


      img.alt =
        "Uploaded image";


      images.appendChild(
        img
      );

    }


    body.appendChild(
      images
    );

  }


  const textEl =
    document.createElement(
      "div"
    );


  textEl.className =
    "msg-text";


  if (
    role === "assistant"
  ){

    renderRichText(
      textEl,
      content || ""
    );

  } else {

    textEl.textContent =
      content || "";

  }


  body.appendChild(
    textEl
  );


  wrap.appendChild(
    body
  );


  messagesEl.appendChild(
    wrap
  );


  return {
    wrap,
    textEl
  };

}


/* =========================================================
   RICH TEXT
========================================================= */

function renderRichText(
  element,
  text
){

  const html =
    DOMPurify.sanitize(
      marked.parse(
        text || ""
      )
    );


  element.innerHTML =
    html;


  if (
    window.renderMathInElement
  ){

    window.renderMathInElement(
      element,
      {
        delimiters:[
          {
            left:"$$",
            right:"$$",
            display:true
          },
          {
            left:"$",
            right:"$",
            display:false
          },
          {
            left:"\\(",
            right:"\\)",
            display:false
          },
          {
            left:"\\[",
            right:"\\]",
            display:true
          }
        ],

        throwOnError:false
      }
    );

  }

}

/* =========================================================
   IMAGE UPLOAD
========================================================= */

attachBtn.addEventListener(
  "click",
  () => {

    if (sending) {
      return;
    }

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  () => {

    const files =
      Array.from(
        fileInput.files || []
      );


    if (!files.length) {
      return;
    }


    for (
      const file of files
    ){

      if (
        !file.type.startsWith(
          "image/"
        )
      ){

        continue;

      }


      const exists =
        pendingImages.some(
          image =>
            image.file.name ===
              file.name &&
            image.file.size ===
              file.size
        );


      if (exists) {
        continue;
      }


      pendingImages.push({

        file,

        url:
          URL.createObjectURL(
            file
          ),

        uploadedUrl:null

      });

    }


    renderImagePreviews();

    updateSendButton();


    /*
     * Reset so the same file
     * can be selected again.
     */

    fileInput.value = "";

  }
);


/* =========================================================
   IMAGE PREVIEWS
========================================================= */

function renderImagePreviews(){

  imagePreview.innerHTML =
    "";


  if (
    !pendingImages.length
  ){

    imagePreview.hidden =
      true;

    return;

  }


  imagePreview.hidden =
    false;


  pendingImages.forEach(
    (
      image,
      index
    ) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "image-preview-item";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        image.url;


      img.alt =
        `Image ${index + 1}`;


      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "image-preview-remove";


      remove.title =
        "Remove image";


      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () => {

          URL.revokeObjectURL(
            image.url
          );


          pendingImages.splice(
            index,
            1
          );


          renderImagePreviews();

          updateSendButton();

        }
      );


      item.appendChild(
        img
      );


      item.appendChild(
        remove
      );


      imagePreview.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   UPLOAD ONE IMAGE
========================================================= */

async function uploadImage(
  file
){

  if (!currentUser) {

    throw new Error(
      "You must be signed in."
    );

  }


  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "png"
    ).toLowerCase();


  const path =
    `${currentUser.id}/${crypto.randomUUID()}.${extension}`;


  const {
    error
  } =
    await supabase.storage
      .from(
        "am-chat-images"
      )
      .upload(
        path,
        file,
        {
          upsert:false,

          contentType:
            file.type
        }
      );


  if (error) {

    throw error;

  }


  const {
    data
  } =
    supabase.storage
      .from(
        "am-chat-images"
      )
      .getPublicUrl(
        path
      );


  return data.publicUrl;

}


/* =========================================================
   UPLOAD ALL IMAGES
========================================================= */

async function uploadPendingImages(){

  const urls = [];


  for (
    const image of pendingImages
  ){

    if (
      image.uploadedUrl
    ){

      urls.push(
        image.uploadedUrl
      );

      continue;

    }


    const url =
      await uploadImage(
        image.file
      );


    image.uploadedUrl =
      url;


    urls.push(
      url
    );

  }


  return urls;

}


/* =========================================================
   CLEAR IMAGES
========================================================= */

function clearPendingImages(){

  for (
    const image of pendingImages
  ){

    if (image.url){

      URL.revokeObjectURL(
        image.url
      );

    }

  }


  pendingImages = [];


  imagePreview.innerHTML =
    "";


  imagePreview.hidden =
    true;


  updateSendButton();

}


/* =========================================================
   API MESSAGE CONVERSION
========================================================= */

function toApiMessages(
  history
){

  return history.map(
    message => {

      /*
       * Multiple images.
       */

      if (
        Array.isArray(
          message.image_urls
        ) &&
        message.image_urls.length
      ){

        const content = [];


        if (
          message.content
        ){

          content.push({

            type:"text",

            text:
              message.content

          });

        }


        for (
          const url of message.image_urls
        ){

          content.push({

            type:"image_url",

            image_url:{
              url
            }

          });

        }


        return {

          role:
            message.role,

          content

        };

      }


      /*
       * Old single-image format.
       */

      if (
        message.image_url
      ){

        return {

          role:
            message.role,

          content:[

            {

              type:"text",

              text:
                message.content ||
                "Please analyze this image."

            },

            {

              type:"image_url",

              image_url:{
                url:
                  message.image_url
              }

            }

          ]

        };

      }


      /*
       * Normal text.
       */

      return {

        role:
          message.role,

        content:
          message.content || ""

      };

    }
  );

}


/* =========================================================
   GET ACCESS TOKEN
========================================================= */

async function getAccessToken(){

  const {
    data,
    error
  } =
    await supabase.auth.getSession();


  if (error) {
    throw error;
  }


  const token =
    data.session?.access_token;


  if (!token){

    throw new Error(
      "Your session has expired. Please sign in again."
    );

  }


  return token;

}


/* =========================================================
   GENERATE CHAT TITLE
========================================================= */

async function generateChatTitle(){

  if (
    !currentChat ||
    !currentMessages.length
  ){

    return;

  }


  try {

    const accessToken =
      await getAccessToken();


    const response =
      await fetch(
        `${SUPABASE_URL}/functions/v1/chat-completion`,
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${accessToken}`

          },

          body:
            JSON.stringify({

              mode:"title",

              messages:
                currentMessages

            })

        }
      );


    if (!response.ok){

      console.error(
        "Title generation failed:",
        await response.text()
      );

      return;

    }


    const data =
      await response.json();


    const title =
      data?.title?.trim();


    if (!title) {
      return;
    }


    /*
     * Don't update if identical.
     */

    if (
      title ===
      currentChat.title
    ){

      return;

    }


    const {
      data:updatedChat,
      error
    } =
      await supabase
        .from("am_chats")
        .update({

          title,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          currentChat.id
        )
        .select()
        .single();


    if (error){

      console.error(
        "Could not update title:",
        error
      );

      return;

    }


    currentChat =
      updatedChat;


    const index =
      chats.findIndex(
        chat =>
          chat.id ===
          currentChat.id
      );


    if (index !== -1){

      chats[index] =
        updatedChat;

    }


    renderChatList();

  } catch (error){

    console.error(
      "generateChatTitle:",
      error
    );

  }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if (sending) {
    return;
  }


  const text =
    input.value.trim();


  /*
   * Copy the currently selected images.
   */

  const selectedImages =
    [...pendingImages];


  /*
   * NOTHING TO SEND.
   *
   * This is important:
   *
   * no text + no images
   * =
   * absolutely nothing happens.
   */

  if (
    !text &&
    selectedImages.length === 0
  ){

    return;

  }


  sending = true;

  updateSendButton();


  const originalText =
    text;


  try {

    /* =====================================================
       CREATE CHAT IF NEEDED
    ====================================================== */

    if (!currentChat){

      const created =
        await createNewChat();


      if (!created){

        throw new Error(
          "Could not create a new chat."
        );

      }

    }


    /* =====================================================
       UPLOAD IMAGES
    ====================================================== */

    let imageUrls = [];


    if (
      selectedImages.length
    ){

      imageUrls =
        await uploadPendingImages();

    }


    /* =====================================================
       CLEAR COMPOSER
    ====================================================== */

    input.value =
      "";


    input.style.height =
      "auto";


    clearPendingImages();


    /* =====================================================
       SAVE USER MESSAGE
    ====================================================== */

    const insertPayload = {

      chat_id:
        currentChat.id,

      role:
        "user",

      content:
        text || "",

      image_urls:
        imageUrls

    };


    /*
     * Compatibility with old schema.
     */

    if (
      imageUrls.length === 1
    ){

      insertPayload.image_url =
        imageUrls[0];

    }


    const {
      data:userMsg,
      error:insertErr
    } =
      await supabase
        .from("am_messages")
        .insert(
          insertPayload
        )
        .select()
        .single();


    if (insertErr){

      throw insertErr;

    }


    currentMessages.push(
      userMsg
    );


    /* =====================================================
       DISPLAY USER MESSAGE
    ====================================================== */

    emptyState.style.display =
      "none";


    appendMessageEl(
      "user",
      text,
      null,
      imageUrls
    );


    scrollToBottom();


    /* =====================================================
       COUNT USER MESSAGES
    ====================================================== */

    const userMessageCount =
      currentMessages.filter(
        message =>
          message.role ===
          "user"
      ).length;


    /*
     * First prompt:
     * generate title.
     */

    if (
      userMessageCount === 1
    ){

      await generateChatTitle();

    }


    /* =====================================================
       ASSISTANT MESSAGE UI
    ====================================================== */

    const {
      textEl
    } =
      appendMessageEl(
        "assistant",
        "",
        null
      );


    textEl.innerHTML =
      `
      <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      `;


    scrollToBottom();


    /* =====================================================
       AUTH TOKEN
    ====================================================== */

    const accessToken =
      await getAccessToken();


    /* =====================================================
       STREAMING EDGE FUNCTION
    ====================================================== */

    const response =
      await fetch(
        `${SUPABASE_URL}/functions/v1/chat-completion`,
        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              `Bearer ${accessToken}`

          },

          body:
            JSON.stringify({

              mode:"chat",

              messages:
                toApiMessages(
                  currentMessages
                )

            })

        }
      );


    if (!response.ok){

      const errorText =
        await response.text();


      throw new Error(
        errorText ||
        `Edge Function returned ${response.status}`
      );

    }


    if (!response.body){

      throw new Error(
        "The AI returned no response."
      );

    }


    /* =====================================================
       STREAM RESPONSE
    ====================================================== */

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder();


    let answer = "";


    textEl.innerHTML =
      "";


    while (true){

      const {
        done,
        value
      } =
        await reader.read();


      if (done){
        break;
      }


      const chunk =
        decoder.decode(
          value,
          {
            stream:true
          }
        );


      answer +=
        chunk;


      /*
       * IMPORTANT:
       *
       * The response is rendered
       * after EVERY received chunk.
       */

      renderRichText(
        textEl,
        answer
      );


      scrollToBottom();

    }


    /*
     * Flush remaining decoder data.
     */

    answer +=
      decoder.decode();


    if (
      answer.trim()
    ){

      /* =================================================
         SAVE ASSISTANT RESPONSE
      ================================================== */

      const {
        data:assistantMsg,
        error:assistantErr
      } =
        await supabase
          .from("am_messages")
          .insert({

            chat_id:
              currentChat.id,

            role:
              "assistant",

            content:
              answer

          })
          .select()
          .single();


      if (assistantErr){

        console.error(
          "Failed to save assistant message:",
          assistantErr
        );

      } else {

        currentMessages.push(
          assistantMsg
        );

      }

    }


    /* =====================================================
       RENAME EVERY 3 USER MESSAGES
    ====================================================== */

    const totalUserMessages =
      currentMessages.filter(
        message =>
          message.role ===
          "user"
      ).length;


    if (
      totalUserMessages > 0 &&
      totalUserMessages % 3 === 0
    ){

      await generateChatTitle();

    }


    /*
     * Update chat timestamp.
     */

    await supabase
      .from("am_chats")
      .update({
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        currentChat.id
      );


  } catch (error){

    console.error(
      "sendMessage error:",
      error
    );


    /*
     * Restore text if sending failed.
     */

    input.value =
      originalText;


    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        200
      ) + "px";


    const errorMessage =
      error instanceof Error
        ? error.message
        : "Something went wrong.";


    /*
     * Display error in chat instead of
     * creating an AI database message.
     */

    const assistantMessages =
      messagesEl.querySelectorAll(
        ".msg.assistant .msg-text"
      );


    const lastAssistant =
      assistantMessages[
        assistantMessages.length - 1
      ];


    if (lastAssistant){

      lastAssistant.textContent =
        "Error: " +
        errorMessage;

    } else {

      alert(
        "Could not send message: " +
        errorMessage
      );

    }


  } finally {

    sending = false;

    updateSendButton();

    scrollToBottom();

  }

}


/* =========================================================
   NEW CHAT
========================================================= */

newChatBtn.addEventListener(
  "click",
  async () => {

    /*
     * New chat creates an EMPTY chat.
     *
     * There is NO automatic AI greeting.
     */

    await createNewChat();

  }
);


/* =========================================================
   INITIAL BUTTON STATE
========================================================= */

updateSendButton();


</script>
