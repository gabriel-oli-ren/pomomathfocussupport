<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Artificial Maths</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
>

<style>

:root{
  --sidebar-bg:#171717;
  --sidebar-hover:#212121;
  --sidebar-active:#2a2a2a;
  --sidebar-text:#ececec;
  --sidebar-muted:#a3a3a3;
  --sidebar-border:#2d2d2d;

  --main-bg:#ffffff;
  --text:#0d0d0d;
  --muted:#6e6e80;
  --border:#e5e5e5;

  --bubble-user:#f2f2f3;
  --accent:#111111;
  --danger:#e5484d;
}

*{
  box-sizing:border-box;
}

html,
body{
  height:100%;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Inter,
    ui-sans-serif,
    system-ui,
    sans-serif;
  background:var(--main-bg);
  color:var(--text);
}

button{
  border:0;
  background:none;
  font:inherit;
  cursor:pointer;
  color:inherit;
}

button:disabled{
  cursor:not-allowed;
}

textarea{
  font:inherit;
}

.app{
  height:100vh;
  display:flex;
  overflow:hidden;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  width:270px;
  flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-text);

  display:flex;
  flex-direction:column;

  padding:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;

  font-weight:650;
  font-size:15px;

  padding:8px 6px 14px;
}

.brand img{
  width:26px;
  height:26px;
  border-radius:7px;
  object-fit:cover;
}

.new-chat-btn{
  display:flex;
  align-items:center;
  gap:10px;

  width:100%;
  padding:11px 12px;

  border:1px solid var(--sidebar-border);
  border-radius:12px;

  text-align:left;
  font-size:14px;
}

.new-chat-btn:hover{
  background:var(--sidebar-hover);
}

.chat-list{
  flex:1;
  overflow-y:auto;
  margin-top:14px;

  display:flex;
  flex-direction:column;
  gap:2px;
}

.chat-list-label{
  font-size:11px;
  color:var(--sidebar-muted);

  padding:10px 10px 4px;

  text-transform:uppercase;
  letter-spacing:.04em;
}

.chat-item{
  position:relative;

  display:flex;
  align-items:center;
  gap:8px;

  padding:9px 10px;

  border-radius:10px;
  font-size:13.5px;

  white-space:nowrap;
  overflow:hidden;
}

.chat-item:hover{
  background:var(--sidebar-hover);
}

.chat-item.active{
  background:var(--sidebar-active);
}

.chat-item .title{
  flex:1;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  text-align:left;
}

.chat-item .delete-btn{
  opacity:0;

  flex-shrink:0;

  padding:3px;
  border-radius:6px;

  color:var(--sidebar-muted);
}

.chat-item:hover .delete-btn{
  opacity:1;
}

.chat-item .delete-btn:hover{
  color:var(--danger);
  background:rgba(255,255,255,.08);
}

.sidebar-bottom{
  border-top:1px solid var(--sidebar-border);

  padding-top:10px;
  margin-top:8px;
}

.user-row{
  display:flex;
  align-items:center;
  gap:9px;

  padding:8px;
  border-radius:10px;
}

.user-row:hover{
  background:var(--sidebar-hover);
}

.user-row img{
  width:26px;
  height:26px;

  border-radius:50%;
  flex-shrink:0;

  object-fit:cover;
}

.user-row .name{
  flex:1;

  font-size:13px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.user-row .signout-btn{
  color:var(--sidebar-muted);

  padding:4px;
  border-radius:6px;
}

.user-row .signout-btn:hover{
  color:var(--sidebar-text);
  background:rgba(255,255,255,.08);
}


/* =========================================================
   MAIN
========================================================= */

.main{
  flex:1;

  display:flex;
  flex-direction:column;

  min-width:0;
  position:relative;
}

.chat-scroll{
  flex:1;
  overflow-y:auto;
}

.messages{
  max-width:768px;

  margin:0 auto;

  padding:40px 22px 170px;

  min-height:100%;
}

.empty-state{
  text-align:center;
  margin-top:16vh;
}

.empty-state h1{
  font-size:30px;

  margin:0 0 8px;

  letter-spacing:-.6px;
}

.empty-state p{
  color:var(--muted);
  margin:0;
}


/* =========================================================
   MESSAGES
========================================================= */

.msg{
  display:flex;

  gap:14px;

  margin:26px 0;

  align-items:flex-start;
}

.msg.user{
  justify-content:flex-end;
}

.avatar{
  width:30px;
  height:30px;

  border-radius:8px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--accent);

  color:#fff;

  font-size:13px;
  font-weight:700;
}

.msg-body{
  max-width:75%;
  min-width:0;
}

.msg.user .msg-body{
  background:var(--bubble-user);

  padding:11px 15px;

  border-radius:18px;
}

.msg.assistant .msg-body{
  padding-top:4px;
}

.msg-images{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-bottom:8px;
}

.msg-image{
  width:280px;
  max-width:100%;
  max-height:320px;

  object-fit:contain;

  border-radius:12px;

  display:block;

  background:#f5f5f5;
}

.msg-text{
  line-height:1.65;
  font-size:15.5px;

  white-space:pre-wrap;
  word-wrap:break-word;
}

.msg.assistant .msg-text p{
  margin:0 0 12px;
}

.msg.assistant .msg-text p:last-child{
  margin-bottom:0;
}

.msg.assistant .msg-text pre{
  background:#0d0d0d;
  color:#f2f2f2;

  padding:12px 14px;

  border-radius:10px;

  overflow-x:auto;

  font-size:13px;
}

.msg.assistant .msg-text code{
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

.msg.assistant .msg-text :not(pre)>code{
  background:#f0f0f1;

  padding:1px 5px;

  border-radius:5px;
}

.msg.assistant .msg-text ul,
.msg.assistant .msg-text ol{
  margin:0 0 12px;
  padding-left:22px;
}


/* =========================================================
   TYPING
========================================================= */

.typing-dots{
  display:flex;

  gap:4px;

  padding:8px 0;
}

.typing-dots span{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#9b9b9b;

  animation:
    bounce
    1.2s
    infinite
    ease-in-out;
}

.typing-dots span:nth-child(2){
  animation-delay:.15s;
}

.typing-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{

  0%,
  80%,
  100%{
    transform:translateY(0);
    opacity:.5;
  }

  40%{
    transform:translateY(-4px);
    opacity:1;
  }

}


/* =========================================================
   COMPOSER
========================================================= */

.composer-wrap{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    14px
    20px
    18px;

  background:
    linear-gradient(
      transparent,
      var(--main-bg) 32%
    );
}

.composer{
  max-width:768px;

  margin:0 auto;

  background:#fff;

  border:1px solid var(--border);

  border-radius:22px;

  box-shadow:
    0 6px 24px
    rgba(0,0,0,.07);
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

.image-preview-container{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  padding:10px 12px 0;
}

.image-preview-item{
  position:relative;

  width:64px;
  height:64px;
}

.image-preview-item img{
  width:64px;
  height:64px;

  object-fit:cover;

  border-radius:10px;

  border:1px solid var(--border);

  display:block;
}

.image-preview-remove{
  position:absolute;

  top:-6px;
  right:-6px;

  width:20px;
  height:20px;

  border-radius:50%;

  background:#111;

  color:#fff;

  font-size:14px;

  line-height:20px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;
}

.image-preview-remove:hover{
  background:var(--danger);
}


/* =========================================================
   COMPOSER ROW
========================================================= */

.composer-row{
  display:flex;

  align-items:flex-end;

  gap:4px;

  padding:6px;
}

.icon-btn{
  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#555;

  flex-shrink:0;
}

.icon-btn:hover{
  background:#f0f0f1;
}

.icon-btn:disabled{
  opacity:.4;
}

.composer textarea{
  flex:1;

  border:0;
  outline:0;

  resize:none;

  min-height:26px;
  max-height:200px;

  padding:9px 6px;

  background:transparent;

  font-size:15.5px;
  line-height:1.4;
}

.send-btn{
  width:34px;
  height:34px;

  border-radius:50%;

  background:#111;
  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  margin:2px;
}

.send-btn:disabled{
  opacity:.3;
  cursor:not-allowed;
}

.disclaimer{
  font-size:11.5px;
  color:var(--muted);

  text-align:center;

  margin-top:8px;
}


/* =========================================================
   AUTH
========================================================= */

.auth-overlay{
  position:fixed;

  inset:0;

  background:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:50;
}

.auth-overlay.hidden{
  display:none;
}

.auth-card{
  text-align:center;

  padding:40px;

  max-width:340px;
}

.auth-card img{
  width:52px;
  height:52px;

  border-radius:14px;

  margin-bottom:18px;

  object-fit:cover;
}

.auth-card h1{
  font-size:24px;

  margin:0 0 6px;

  letter-spacing:-.5px;
}

.auth-card p{
  color:var(--muted);

  margin:0 0 26px;

  font-size:14.5px;
}

.auth-btn{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  width:100%;

  padding:12px 16px;

  border:1px solid var(--border);

  border-radius:12px;

  font-size:14.5px;

  font-weight:550;

  text-decoration:none;

  color:var(--text);
}

.auth-btn:hover{
  background:#f7f7f8;
}

.auth-btn:disabled{
  opacity:.6;
}

.auth-btn.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.auth-btn.primary:hover{
  opacity:.9;
  background:var(--accent);
}

.auth-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.auth-status{
  font-size:12.5px;

  color:var(--muted);

  margin-top:16px;

  line-height:1.5;
}


/* =========================================================
   SCROLL TO BOTTOM BUTTON
========================================================= */

.scroll-bottom-btn{
  position:absolute;

  left:50%;
  bottom:132px;

  transform:
    translateX(-50%)
    translateY(8px);

  width:38px;
  height:38px;

  border-radius:50%;

  background:#fff;

  border:1px solid var(--border);

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.12);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  z-index:30;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .15s ease,
    transform .15s ease;
}

.scroll-bottom-btn.visible{
  opacity:1;
  pointer-events:auto;

  transform:
    translateX(-50%)
    translateY(0);
}

.scroll-bottom-btn:hover{
  background:#f7f7f7;
}

.scroll-bottom-btn svg{
  width:18px;
  height:18px;

  stroke:var(--text);
  stroke-width:2.2;
  fill:none;

  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

  .sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    z-index:40;

    transform:translateX(-100%);

    transition:
      transform .2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .messages{
    padding-left:14px;
    padding-right:14px;
  }

  .msg-body{
    max-width:88%;
  }

  .composer-wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .msg-image{
    width:240px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside
  class="sidebar"
  id="sidebar"
>

  <div class="brand">

    <img
      src="maths-logo.png"
      alt=""
    >

    Artificial Maths

  </div>


  <button
    class="new-chat-btn"
    id="newChatBtn"
    type="button"
  >

    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M12 5v14"/>
      <path d="M5 12h14"/>
    </svg>

    New chat

  </button>


  <div class="chat-list-label">
    Chats
  </div>


  <div
    class="chat-list"
    id="chatList"
  ></div>


  <div class="sidebar-bottom">

    <div
      class="user-row"
      id="userRow"
    >

      <img
        id="userAvatar"
        alt=""
      >

      <span
        class="name"
        id="userName"
      ></span>


      <button
        class="signout-btn"
        id="signOutBtn"
        type="button"
        title="Sign out"
      >

        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
          />

          <path
            d="M16 17l5-5-5-5"
          />

          <path
            d="M21 12H9"
          />

        </svg>

      </button>

    </div>

  </div>

</aside>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">

  <div
    class="chat-scroll"
    id="chatScroll"
  >

    <div
      class="messages"
      id="messages"
    >

      <div
        class="empty-state"
        id="emptyState"
      >

        <h1>
          What can I help you with?
        </h1>

        <p>
          Maths, coding, science, ideas, research and more.
        </p>

      </div>

    </div>

  </div>


  <button
    class="scroll-bottom-btn"
    id="scrollBottomBtn"
    type="button"
    aria-label="Scroll to bottom"
  >

    <svg viewBox="0 0 24 24">
      <path d="M6 9l6 6 6-6" />
    </svg>

  </button>


  <!-- =====================================================
       COMPOSER
  ====================================================== -->

  <div class="composer-wrap">

    <div class="composer">


      <div
        class="image-preview-container"
        id="imagePreview"
        hidden
      ></div>


      <div class="composer-row">


        <button
          class="icon-btn"
          id="attachBtn"
          type="button"
          title="Attach images"
        >

          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path
              d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
            />

          </svg>

        </button>


        <input
          type="file"
          id="fileInput"
          accept="image/*"
          multiple
          hidden
        >


        <textarea
          id="input"
          rows="1"
          placeholder="Message Artificial Maths..."
        ></textarea>


        <button
          class="send-btn"
          id="sendBtn"
          type="button"
          title="Send"
          disabled
        >

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
          >

            <path
              d="M12 19V5"
            />

            <path
              d="M5 12l7-7 7 7"
            />

          </svg>

        </button>


      </div>

    </div>


    <div class="disclaimer">
      AI responses can be inaccurate. Check important information.
    </div>

  </div>

</main>


<!-- =======================================================
     AUTH
======================================================= -->

<div
  class="auth-overlay"
  id="authOverlay"
>

  <div class="auth-card">

    <img
      src="maths-logo.png"
      alt=""
    >

    <h1>
      Artificial Maths
    </h1>

    <p>
      Sign in through Maths Support to use Artificial Maths.
    </p>


    <div class="auth-actions">

      <a
        class="auth-btn primary"
        id="openMathsSupportBtn"
        href="https://mathssupport.es"
        target="_blank"
        rel="noopener"
      >
        Open Maths Support
      </a>

      <button
        class="auth-btn"
        id="reloadAfterSignInBtn"
        type="button"
      >
        I've signed in — Reload
      </button>

    </div>


    <div
      class="auth-status"
      id="authStatus"
    ></div>

  </div>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

import {
  marked
} from "https://cdn.jsdelivr.net/npm/marked@11/+esm";

import DOMPurify
  from "https://cdn.jsdelivr.net/npm/dompurify@3/+esm";


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://inidxltybmadzgggvpxz.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluaWR4bHR5Ym1hZHpnZ2d2cHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjMyOTMsImV4cCI6MjEwMjg5OTI5M30.7yrNe9mk_cj6YPi4adutrKfC0pDZxWLyUcsdvbnkSqY";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


marked.setOptions({
  breaks:true
});


/* =========================================================
   DOM
========================================================= */

const authOverlay =
  document.getElementById("authOverlay");

const authStatus =
  document.getElementById("authStatus");

const reloadAfterSignInBtn =
  document.getElementById("reloadAfterSignInBtn");

const signOutBtn =
  document.getElementById("signOutBtn");

const userAvatar =
  document.getElementById("userAvatar");

const userName =
  document.getElementById("userName");

const newChatBtn =
  document.getElementById("newChatBtn");

const chatList =
  document.getElementById("chatList");

const messagesEl =
  document.getElementById("messages");

const emptyState =
  document.getElementById("emptyState");

const chatScroll =
  document.getElementById("chatScroll");

const scrollBottomBtn =
  document.getElementById("scrollBottomBtn");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const attachBtn =
  document.getElementById("attachBtn");

const fileInput =
  document.getElementById("fileInput");

const imagePreview =
  document.getElementById("imagePreview");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let chats = [];

let currentChat = null;

let currentMessages = [];

let pendingImages = [];

let sending = false;


/* =========================================================
   AUTH
========================================================= */

reloadAfterSignInBtn.addEventListener(
  "click",
  () => {

    window.location.reload();

  }
);


signOutBtn.addEventListener(
  "click",
  async () => {

    await supabase.auth.signOut();

  }
);


/* =========================================================
   SESSION
========================================================= */

async function handleSession(session){

  currentUser =
    session?.user || null;


  if(currentUser){

    authOverlay.classList.add("hidden");


    userName.textContent =
      currentUser.user_metadata?.full_name ||
      currentUser.email ||
      "Account";


    const avatar =
      currentUser.user_metadata?.avatar_url;


    if(avatar){
      userAvatar.src = avatar;
    }else{
      userAvatar.removeAttribute("src");
    }


    await loadChats();

  }else{

    authOverlay.classList.remove("hidden");

    authStatus.textContent = "";

    chats = [];

    currentChat = null;

    currentMessages = [];

    clearPendingImages();

    renderChatList();

    renderMessages();

  }

}


/* =========================================================
   INITIAL SESSION
========================================================= */

try{

  const {
    data,
    error
  } =
    await supabase.auth.getSession();


  if(error){
    throw error;
  }


  await handleSession(
    data.session
  );

}catch(error){

  console.error(
    "Session error:",
    error
  );

  authStatus.textContent =
    error.message ||
    "Could not connect to Supabase.";

}

/* =========================================================
   LOAD CHATS
========================================================= */

async function loadChats(){

  if(!currentUser){
    return;
  }


  const {
    data,
    error
  } =
    await supabase
      .from("am_chats")
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "updated_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "Failed to load chats:",
      error
    );

    showDatabaseError(
      error,
      "load chats"
    );

    return;
  }


  chats =
    data || [];


  renderChatList();


  if(
    chats.length &&
    !currentChat
  ){

    await selectChat(
      chats[0]
    );

  }else if(!chats.length){

    currentChat = null;

    currentMessages = [];

    renderMessages();

  }

}


/* =========================================================
   DATABASE ERROR
========================================================= */

function showDatabaseError(
  error,
  action
){

  const message =
    error?.message ||
    error?.error_description ||
    "Unknown Supabase error";


  console.error(
    `Supabase error while trying to ${action}:`,
    error
  );


  authStatus.textContent =
    `Supabase error: ${message}`;

}

   CHAT LIST
========================================================= */

function renderChatList(){

  chatList.innerHTML = "";


  for(const chat of chats){

    const item =
      document.createElement("div");

        currentChat &&
        currentChat.id === chat.id
          ? " active"
          : ""
      );


    const title =
      document.createElement("span");


    title.className =
      "title";


    title.textContent =
      chat.title ||
      "New chat";


    const del =
      document.createElement("button");


    del.className =
      "delete-btn";

    del.type =
      "button";

    del.title =
      "Delete chat";


    del.innerHTML =
      `
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M3 6h18"/>
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>

/* =========================================================
   SELECT CHAT
========================================================= */

async function selectChat(chat){

  if(sending){
    return;
  }


  currentChat =
    chat;


  renderChatList();


  const {
    data,
    error
  } =
    await supabase
      .from("am_messages")
      .select("*")
      .eq(
        "chat_id",
        chat.id
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "Failed to load messages:",
      error
    );

    showDatabaseError(
      error,
      "load messages"
    );

    return;

  }


  currentMessages =
    data || [];


  renderMessages();

}


/* =========================================================
   CREATE CHAT
========================================================= */

async function createNewChat(){

  if(!currentUser){

    throw new Error(
      "You must be signed in."
    );

  }


  const {
    data,
    error
  } =
    await supabase
      .from("am_chats")
      .insert({

        user_id:
          currentUser.id,

        title:
          "New chat"

      })
      .select()
      .single();


  if(error){

    console.error(
      "Failed to create chat:",
      error
    );

    throw error;

  }


  chats.unshift(data);

  currentChat =
    data;

  currentMessages = [];

  renderChatList();

  renderMessages();

  return data;

}


/* =========================================================
   DELETE CHAT
========================================================= */

async function deleteChat(chat){

  if(
    !confirm(
      "Delete this chat?"
    )
  ){
    return;
  }


  const {
    error
  } =
    await supabase
      .from("am_chats")
      .delete()
      .eq(
        "id",
        chat.id
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(error){

    console.error(
      "Failed to delete chat:",
      error
    );

    alert(
      "Could not delete chat:\n\n" +
      error.message
    );

    return;

  }


  chats =
    chats.filter(
      c =>
        c.id !== chat.id
    );


  if(
    currentChat &&
    currentChat.id === chat.id
  ){

    currentChat = null;

    currentMessages = [];


    if(chats.length){

      await selectChat(
        chats[0]
      );

    }else{

      renderMessages();

    }

  }


  renderChatList();

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(){

  messagesEl.innerHTML = "";


  if(!currentMessages.length){

    messagesEl.appendChild(
      emptyState
    );

    emptyState.style.display = "";

    return;

  }


  emptyState.style.display =
    "none";


  for(
    const message of currentMessages
  ){

    appendMessageEl(
      message.role,
      message.content,
      normalizeImageUrls(
        message.image_urls
      )
    );

  }


  scrollToBottom({
    force:true
  });

}


/* =========================================================
   NORMALIZE JSONB IMAGE URLS
========================================================= */

function normalizeImageUrls(value){

  if(Array.isArray(value)){
    return value.filter(
      url =>
        typeof url === "string" &&
        url.trim()
    );
  }


  if(typeof value === "string"){

    try{

      const parsed =
        JSON.parse(value);


      if(Array.isArray(parsed)){

        return parsed.filter(
          url =>
            typeof url === "string" &&
            url.trim()
        );

      }

    }catch{

      return [];

    }

  }


  return [];

}


/* =========================================================
   APPEND MESSAGE
========================================================= */

function appendMessageEl(
  role,
  content,
  imageUrls = []
){

  const wrap =
    document.createElement("div");


  wrap.className =
    "msg " + role;


  if(role === "assistant"){

    const avatar =
      document.createElement("div");


    avatar.className =
      "avatar";


    avatar.textContent =
      "AM";


    wrap.appendChild(avatar);

  }


  const body =
    document.createElement("div");


  body.className =
    "msg-body";


  const urls = [];


  if(Array.isArray(imageUrls)){

    for(
      const url of imageUrls
    ){

      if(
        url &&
        !urls.includes(url)
      ){

        urls.push(url);

      }

    }

  }


  if(urls.length){

    const images =
      document.createElement("div");


    images.className =
      "msg-images";


    for(
      const url of urls
    ){

      const img =
        document.createElement("img");


      img.className =
        "msg-image";


      img.src =
        url;


      img.alt =
        "Uploaded image";


      img.loading =
        "lazy";


      images.appendChild(img);

    }


    body.appendChild(images);

  }


  if(content || role === "assistant"){

    const textEl =
      document.createElement("div");


    textEl.className =
      "msg-text";


    if(role === "assistant"){

      renderRichText(
        textEl,
        content || ""
      );

    }else{

      textEl.textContent =
        content || "";

    }


    body.appendChild(textEl);


    wrap.appendChild(body);


    messagesEl.appendChild(wrap);


    return {
      wrap,
      textEl
    };

  }


  wrap.appendChild(body);

  messagesEl.appendChild(wrap);


  return {
    wrap,
    textEl:null
  };

}


/* =========================================================
   RICH TEXT
========================================================= */

function renderRichText(
  element,
  text
){

  if(!text){

    element.innerHTML = "";

    return;

  }


  try{

    const html =
      DOMPurify.sanitize(
        marked.parse(text)
      );


    element.innerHTML =
      html;


    if(window.renderMathInElement){

      window.renderMathInElement(
        element,
        {

          delimiters:[

            {
              left:"$$",
              right:"$$",
              display:true
            },

            {
              left:"$",
              right:"$",
              display:false
            },

            {
              left:"\\(",
              right:"\\)",
              display:false
            },

            {
              left:"\\[",
              right:"\\]",
              display:true
            }

          ],

          throwOnError:false

        }
      );

    }

  }catch(error){

    console.error(
      "Rich text rendering error:",
      error
    );

    element.textContent =
      text;

  }

}


/* =========================================================
   SMOOTH TYPING EFFECT
========================================================= */

/*
 * The network can deliver chunks in bursts (a few
 * characters, then a big blob, then nothing for a bit).
 * Dumping every chunk straight into the DOM as it arrives
 * looks jumpy/too fast.
 *
 * This wraps a target element and "smooths" the reveal:
 * whenever new text arrives we just update the target,
 * and a requestAnimationFrame loop reveals a small, steady
 * number of characters per frame instead. If the network
 * gets far ahead of what's on screen, the reveal speeds up
 * a bit so it never lags noticeably behind the real answer.
 */

function createSmoothTyper(
  element,
  {
    charsPerFrame = 2,
    onRender = null
  } = {}
){

  let target = "";
  let shown = 0;
  let rafId = null;
  let streamEnded = false;


  function renderShown(){

    renderRichText(
      element,
      target.slice(0, shown)
    );


    if(onRender){
      onRender();
    }

  }


  function tick(){

    rafId = null;


    if(shown >= target.length){

      if(streamEnded){

        renderShown();

      }

      return;

    }


    const remaining =
      target.length - shown;

    /*
     * Catch up faster the further behind we are, so a
     * big burst of text doesn't take forever to appear.
     */

    const step =
      Math.max(
        charsPerFrame,
        Math.ceil(remaining / 40)
      );


    shown =
      Math.min(
        target.length,
        shown + step
      );


    renderShown();


    rafId =
      requestAnimationFrame(tick);

  }


  return {

    update(newTarget){

      target = newTarget;


      if(rafId === null){

        rafId =
          requestAnimationFrame(tick);

      }

    },

    finish(){

      streamEnded = true;


      if(rafId === null){

        shown = target.length;

        renderShown();

      }

    }

  };

}


/* =========================================================
   SCROLL
========================================================= */

/*
 * How close (in px) to the bottom the user has to be
 * for us to consider them "at the bottom" and therefore
 * keep auto-scrolling while the AI streams text.
 */

const SCROLL_BOTTOM_THRESHOLD = 80;


function isNearBottom(){

  const distance =
    chatScroll.scrollHeight -
    chatScroll.scrollTop -
    chatScroll.clientHeight;


  return distance < SCROLL_BOTTOM_THRESHOLD;

}


function updateScrollBottomBtn(){

  if(!scrollBottomBtn){
    return;
  }


  if(isNearBottom()){

    scrollBottomBtn.classList.remove("visible");

  }else{

    scrollBottomBtn.classList.add("visible");

  }

}


/*
 * scrollToBottom() is called a lot while the AI is
 * streaming. If the user has scrolled up to read
 * something earlier, we should NOT yank them back down -
 * only "stick" to the bottom if they were already there.
 *
 * Pass force:true to always scroll (e.g. right after the
 * user sends a message).
 */

function scrollToBottom(
  {
    force = false
  } = {}
){

  const shouldStick =
    force ||
    isNearBottom();


  if(!shouldStick){

    updateScrollBottomBtn();

    return;

  }


  requestAnimationFrame(
    () => {

      chatScroll.scrollTop =
        chatScroll.scrollHeight;


      updateScrollBottomBtn();

    }
  );

}


if(chatScroll){

  chatScroll.addEventListener(
    "scroll",
    updateScrollBottomBtn,
    {
      passive:true
    }
  );

}


if(scrollBottomBtn){

  scrollBottomBtn.addEventListener(
    "click",
    () => {

      chatScroll.scrollTo({

        top:
          chatScroll.scrollHeight,

        behavior:"smooth"

      });

    }
  );

}

/* =========================================================
   IMAGE UPLOAD SELECTOR
========================================================= */

attachBtn.addEventListener(
  "click",
  () => {

    if(sending){
      return;
    }

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  () => {

    const files =
      Array.from(
        fileInput.files || []
      );


    if(!files.length){
      return;
    }


    let rejectedSvg = false;


    for(
      const file of files
    ){

      if(
        !file.type.startsWith("image/")
      ){

        continue;

      }


      /*
       * SVGs are XML, not a raster image. The vision
       * model (via OpenRouter) rejects them with a
       * confusing "did not return an image" error, so
       * we filter them out before they ever get queued.
       */

      if(
        file.type === "image/svg+xml"
      ){

        rejectedSvg = true;

        continue;

      }


      const exists =
        pendingImages.some(
          image =>
            image.file.name === file.name &&
            image.file.size === file.size &&
            image.file.lastModified === file.lastModified
        );


      if(exists){
        continue;
      }


      pendingImages.push({

        file,

        url:
          URL.createObjectURL(file),

        uploadedUrl:null

      });

    }


    renderImagePreviews();

    updateSendButton();


    if(rejectedSvg){

      alert(
        "SVG images aren't supported. " +
        "Please upload a PNG, JPEG, WEBP or similar image instead."
      );

    }


    /*
     * Allows selecting the same file again.
     */

    fileInput.value = "";

  }
);


/* =========================================================
   IMAGE PREVIEWS
========================================================= */

function renderImagePreviews(){

  imagePreview.innerHTML = "";


  if(!pendingImages.length){

    imagePreview.hidden = true;

    return;

  }


  imagePreview.hidden = false;


  pendingImages.forEach(
    (
      image,
      index
    ) => {

      const item =
        document.createElement("div");


      item.className =
        "image-preview-item";


      const img =
        document.createElement("img");


      img.src =
        image.url;


      img.alt =
        `Image ${index + 1}`;


      const remove =
        document.createElement("button");


      remove.type =
        "button";


      remove.className =
        "image-preview-remove";


      remove.title =
        "Remove image";


      remove.textContent =
        "×";


      remove.addEventListener(
        "click",
        () => {

          URL.revokeObjectURL(
            image.url
          );


          pendingImages.splice(
            index,
            1
          );


          renderImagePreviews();

          updateSendButton();

        }
      );


      item.appendChild(img);

      item.appendChild(remove);

      imagePreview.appendChild(item);

    }
  );

}


/* =========================================================
   UPLOAD IMAGE
========================================================= */

async function uploadImage(file){

  if(!currentUser){

    throw new Error(
      "You must be signed in."
    );

  }


  const extension =
    (
      file.name
        .split(".")
        .pop() ||
      "png"
    ).toLowerCase();


  const path =
    `${currentUser.id}/${crypto.randomUUID()}.${extension}`;


  const {
    error
  } =
    await supabase.storage
      .from("am-chat-images")
      .upload(
        path,
        file,
        {

          upsert:false,

          contentType:
            file.type

        }
      );


  if(error){
    throw error;
  }


  const {
    data
  } =
    supabase.storage
      .from("am-chat-images")
      .getPublicUrl(path);


  if(!data?.publicUrl){

    throw new Error(
      "Could not create the public image URL."
    );

  }


  return data.publicUrl;

}


/* =========================================================
   UPLOAD ALL
========================================================= */

async function uploadPendingImages(){

  const urls = [];


  for(
    const image of pendingImages
  ){

    if(image.uploadedUrl){

      urls.push(
        image.uploadedUrl
      );

      continue;

    }


    const url =
      await uploadImage(
        image.file
      );


    image.uploadedUrl =
      url;


    urls.push(url);

  }


  return urls;

}


/* =========================================================
   CLEAR PENDING IMAGES
========================================================= */

function clearPendingImages(){

  for(
    const image of pendingImages
  ){

    if(image.url){

      URL.revokeObjectURL(
        image.url
      );

    }

  }


  pendingImages = [];


  imagePreview.innerHTML =
    "";


  imagePreview.hidden =
    true;


  fileInput.value = "";


  updateSendButton();

}


/* =========================================================
   API MESSAGE CONVERSION
========================================================= */

function toApiMessages(history){

  return history.map(
    message => {

      const images =
        normalizeImageUrls(
          message.image_urls
        );


      if(images.length){

        const content = [];


        if(message.content){

          content.push({

            type:"text",

            text:
              message.content

          });

        }


        for(
          const url of images
        ){

          content.push({

            type:"image_url",

            image_url:{
              url:url
            }

          });

        }


        return {

          role:
            message.role,

          content

        };

      }


      return {

        role:
          message.role,

        content:
          message.content || ""

      };

    }
  );

}


/* =========================================================
   ACCESS TOKEN
========================================================= */

async function getAccessToken(){

  const {
    data,
    error
  } =
    await supabase.auth.getSession();


  if(error){
    throw error;
  }


  const token =
    data.session?.access_token;


  if(!token){

    throw new Error(
      "Your session has expired. Please sign in again."
    );

  }


  return token;

}


/* =========================================================
   EDGE FUNCTION REQUEST
========================================================= */

async function callEdgeFunction(
  body
){

  const accessToken =
    await getAccessToken();


  const response =
    await fetch(
      `${SUPABASE_URL}/functions/v1/chat-completion`,
      {

        method:"POST",

        headers:{

          "Content-Type":
            "application/json",

          "apikey":
            SUPABASE_ANON_KEY,

          "Authorization":
            `Bearer ${accessToken}`

        },

        body:
          JSON.stringify(body)

      }
    );


  if(!response.ok){

    const text =
      await response.text();


    let message =
      text;


    try{

      const json =
        JSON.parse(text);


      /*
       * Error payloads can come in many shapes
       * depending on the provider / edge function:
       *
       *   { error: "some string" }
       *   { error: { message: "some string" } }
       *   { message: "some string" }
       *   { error: { error: { message: "..." } } }
       *
       * Walk through the common shapes and always
       * end up with a plain string, so we never do
       * `new Error(someObject)` (which produces the
       * useless "[object Object]" message).
       */

      const candidate =
        json?.error?.message ??
        json?.error?.error?.message ??
        json?.message ??
        json?.error ??
        json?.msg ??
        null;


      if(typeof candidate === "string" && candidate.trim()){

        message = candidate;

      }else if(candidate && typeof candidate === "object"){

        try{

          message =
            JSON.stringify(candidate);

        }catch{

          message = text;

        }

      }else{

        message = text;

      }

    }catch{

      /* response wasn't JSON */

    }


    if(
      typeof message !== "string" ||
      !message.trim()
    ){

      message =
        `Edge Function returned HTTP ${response.status}`;

    }


    throw new Error(message);

  }


  return response;

}


/* =========================================================
   READ STREAM
========================================================= */

async function readAIStream(
  response,
  onText
){

  if(!response.body){

    throw new Error(
      "The Edge Function returned no response body."
    );

  }


  const reader =
    response.body.getReader();


  const decoder =
    new TextDecoder();


  let buffer = "";

  let answer = "";


  while(true){

    const {
      done,
      value
    } =
      await reader.read();


    if(done){
      break;
    }


    buffer +=
      decoder.decode(
        value,
        {
          stream:true
        }
      );


    /*
     * Support normal text streaming.
     */

    const lines =
      buffer.split("\n");


    buffer =
      lines.pop() || "";


    for(
      const rawLine of lines
    ){

      const line =
        rawLine.trim();


      if(!line){
        continue;
      }


      /*
       * Support SSE:
       * data: {...}
       */

      if(line.startsWith("data:")){

        const dataPart =
          line.slice(5).trim();


        if(dataPart === "[DONE]"){
          continue;
        }


        try{

          const parsed =
            JSON.parse(dataPart);


          const token =
            parsed?.choices?.[0]?.delta?.content ??
            parsed?.choices?.[0]?.message?.content ??
            parsed?.content ??
            parsed?.text ??
            "";


          if(token){

            answer += token;

            onText(answer);

          }

        }catch{

          /*
           * If it isn't JSON, treat it
           * as streamed text.
           */

          if(dataPart){

            answer += dataPart;

            onText(answer);

          }

        }


        continue;

      }


      /*
       * Support JSON chunks.
       */

      if(
        line.startsWith("{") &&
        line.endsWith("}")
      ){

        try{

          const parsed =
            JSON.parse(line);


          const token =
            parsed?.choices?.[0]?.delta?.content ??
            parsed?.choices?.[0]?.message?.content ??
            parsed?.content ??
            parsed?.text ??
            "";


          if(token){

            answer += token;

            onText(answer);

          }

          continue;

        }catch{

          /* fall through */

        }

      }


      /*
       * Normal raw streaming text.
       */

      answer += line + "\n";

      onText(answer);

    }

  }


  buffer +=
    decoder.decode();


  if(buffer.trim()){

    const finalText =
      buffer.trim();


    if(finalText.startsWith("data:")){

      const dataPart =
        finalText.slice(5).trim();


      if(dataPart !== "[DONE]"){

        try{

          const parsed =
            JSON.parse(dataPart);


          const token =
            parsed?.choices?.[0]?.delta?.content ??
            parsed?.choices?.[0]?.message?.content ??
            parsed?.content ??
            parsed?.text ??
            "";


          if(token){

            answer += token;

            onText(answer);

          }

        }catch{

          if(dataPart){

            answer += dataPart;

            onText(answer);

          }

        }

      }

    }else{

      try{

        const parsed =
          JSON.parse(finalText);


        const token =
          parsed?.choices?.[0]?.message?.content ??
          parsed?.choices?.[0]?.delta?.content ??
          parsed?.content ??
          parsed?.text ??
          "";


        if(token){

          answer += token;

          onText(answer);

        }

      }catch{

        answer += finalText;

        onText(answer);

      }

    }

  }


  return answer;

}


/* =========================================================
   GENERATE CHAT TITLE
========================================================= */

async function generateChatTitle(){

  if(
    !currentChat ||
    !currentMessages.length
  ){

    return;

  }


  try{

    const response =
      await callEdgeFunction({

        mode:"title",

        messages:
          toApiMessages(
            currentMessages
          )

      });


    /*
     * Title requests return JSON with { title: "..." }
     */

    const raw =
      await response.text();


    let title = "";


    try{

      const data =
        JSON.parse(raw);


      title =
        data?.title?.trim() ||
        "";

    }catch(error){

      console.error(
        "Failed to parse title response:",
        error,
        "Raw response:",
        raw
      );

      return;

    }


    /*
     * Remove accidental quotes.
     */

    title =
      title
        .replace(/^["']+|["']+$/g,"")
        .trim();


    if(!title){
      return;
    }


    /*
     * Keep titles short.
     */

    if(title.length > 80){

      title =
        title.substring(0,80).trim();

    }


    if(
      title.toLowerCase() ===
      (currentChat.title || "").toLowerCase()
    ){

      return;

    }


    const {
      data:updatedChat,
      error
    } =
      await supabase
        .from("am_chats")
        .update({

          title:title,

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          currentChat.id
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .select()
        .single();


    if(error){

      console.error(
        "Could not update chat title:",
        error
      );

      return;

    }


    currentChat =
      updatedChat;


    const index =
      chats.findIndex(
        chat =>
          chat.id ===
          updatedChat.id
      );


    if(index !== -1){

      chats[index] =
        updatedChat;

    }


    renderChatList();

  }catch(error){

    /*
     * Title failure should NOT break
     * the actual conversation.
     */

    console.error(
      "Chat title generation failed:",
      error
    );

  }

}


/* =========================================================
   SAVE USER MESSAGE
========================================================= */

async function saveUserMessage(
  text,
  imageUrls
){

  /*
   * IMPORTANT:
   *
   * image_urls is JSONB in Supabase.
   * Supabase JS client handles JavaScript arrays
   * automatically for JSONB columns - no need to stringify.
   */

  const payload = {

    chat_id:
      currentChat.id,

    role:
      "user",

    content:
      text || "",

    image_urls:
      imageUrls || []

  };


  const {
    data,
    error
  } =
    await supabase
      .from("am_messages")
      .insert(payload)
      .select()
      .single();


  if(error){

    console.error(
      "Failed to save user message:",
      error
    );

    throw error;

  }


  return data;

}


/* =========================================================
   SAVE ASSISTANT MESSAGE
========================================================= */

async function saveAssistantMessage(
  answer
){

  if(!answer.trim()){
    return null;
  }


  const {
    data,
    error
  } =
    await supabase
      .from("am_messages")
      .insert({

        chat_id:
          currentChat.id,

        role:
          "assistant",

        content:
          answer,

        image_urls:
          []

      })
      .select()
      .single();


  if(error){

    console.error(
      "Failed to save assistant message:",
      error
    );

    throw error;

  }


  return data;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sending){
    return;
  }


  const text =
    input.value.trim();


  const selectedImages =
    [...pendingImages];


  /*
   * NOTHING TO SEND.
   *
   * No text + no images =
   * absolutely nothing happens.
   */

  if(
    !text &&
    selectedImages.length === 0
  ){

    return;

  }


  sending = true;

  updateSendButton();


  const originalText =
    text;


  let assistantUI = null;

  let userMessageWasSaved = false;


  try{

    /* =====================================================
       CREATE CHAT
    ====================================================== */

    if(!currentChat){

      await createNewChat();

    }


    if(!currentChat){

      throw new Error(
        "Could not create a new chat."
      );

    }


    /* =====================================================
       UPLOAD IMAGES
    ====================================================== */

    let imageUrls = [];


    if(selectedImages.length){

      imageUrls =
        await uploadPendingImages();

    }


    /*
     * At this point imageUrls contains ONLY
     * actual uploaded images.
     *
     * If no image was selected:
     *
     * imageUrls = []
     *
     * Therefore nothing is displayed.
     */


    /* =====================================================
       SAVE USER MESSAGE
    ====================================================== */

    const userMsg =
      await saveUserMessage(
        text,
        imageUrls
      );


    userMessageWasSaved = true;


    currentMessages.push(
      userMsg
    );


    /* =====================================================
       CLEAR COMPOSER
    ====================================================== */

    input.value = "";

    input.style.height = "auto";

    clearPendingImages();


    /* =====================================================
       DISPLAY USER MESSAGE
    ====================================================== */

    emptyState.style.display =
      "none";


    appendMessageEl(
      "user",
      text,
      imageUrls
    );


    scrollToBottom({
      force:true
    });


    /* =====================================================
       ASSISTANT UI
    ====================================================== */

    assistantUI =
      appendMessageEl(
        "assistant",
        "",
        []
      );


    assistantUI.textEl.innerHTML =
      `
      <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
      `;


    scrollToBottom({
      force:true
    });


    /* =====================================================
       CALL AI
    ====================================================== */

    const response =
      await callEdgeFunction({

        messages:
          toApiMessages(
            currentMessages
          )

      });


    /* =====================================================
       STREAM AI
    ====================================================== */

    assistantUI.textEl.innerHTML = "";


    let answer = "";


    const typer =
      createSmoothTyper(
        assistantUI.textEl,
        {
          onRender:
            scrollToBottom
        }
      );


    answer =
      await readAIStream(
        response,
        streamedText => {

          typer.update(
            streamedText
          );

        }
      );


    typer.finish();


    answer =
      answer.trim();


    /* =====================================================
       AI RETURNED NOTHING
    ====================================================== */

    if(!answer){

      assistantUI.wrap.remove();

      throw new Error(
        "The AI returned an empty response."
      );

    }


    /* =====================================================
       SAVE ASSISTANT RESPONSE
    ====================================================== */

    const assistantMsg =
      await saveAssistantMessage(
        answer
      );


    if(assistantMsg){

      currentMessages.push(
        assistantMsg
      );

    }


    /* =====================================================
       UPDATE CHAT TIME
    ====================================================== */

    const {
      data:updatedChat,
      error:updateError
    } =
      await supabase
        .from("am_chats")
        .update({

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          currentChat.id
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .select()
        .single();


    if(!updateError && updatedChat){

      currentChat =
        updatedChat;


      const index =
        chats.findIndex(
          chat =>
            chat.id ===
            updatedChat.id
        );


      if(index !== -1){

        chats[index] =
          updatedChat;

      }


      renderChatList();

    }


    /* =====================================================
       TITLE LOGIC
    ====================================================== */

    const userMessageCount =
      currentMessages.filter(
        message =>
          message.role === "user"
      ).length;


    /*
     * FIRST PROMPT:
     * Generate the chat title AFTER
     * the AI has answered.
     */

    if(userMessageCount === 1){

      await generateChatTitle();

    }


    /*
     * EVERY 3 USER MESSAGES:
     *
     * 3, 6, 9, 12...
     */

    else if(
      userMessageCount > 0 &&
      userMessageCount % 3 === 0
    ){

      await generateChatTitle();

    }


  }catch(error){

    console.error(
      "sendMessage error:",
      error
    );


    /*
     * Errors can arrive in different shapes:
     *
     *   - a real Error/DOMException -> use .message
     *   - a Supabase PostgrestError  -> plain object
     *     with a .message (and .details/.hint/.code),
     *     NOT an instance of Error
     *   - a plain string
     *   - something unexpected
     *
     * Extract a readable string in every case so we
     * never show the useless "Error: [object Object]".
     */

    let errorMessage;


    if(error instanceof Error){

      errorMessage =
        error.message;

    }else if(typeof error === "string"){

      errorMessage =
        error;

    }else if(
      error &&
      typeof error === "object" &&
      typeof error.message === "string" &&
      error.message.trim()
    ){

      errorMessage =
        error.message +
        (
          error.hint
            ? ` (${error.hint})`
            : ""
        );

    }else if(error){

      try{

        errorMessage =
          JSON.stringify(error);

      }catch{

        errorMessage =
          "An unknown error occurred.";

      }

    }else{

      errorMessage =
        "An unknown error occurred.";

    }


    /*
     * Remove empty assistant UI if
     * the AI failed before generating.
     */

    if(
      assistantUI &&
      assistantUI.textEl &&
      !assistantUI.textEl.textContent.trim()
    ){

      assistantUI.wrap.remove();

    }


    /*
     * Restore text if something failed.
     */

    input.value =
      originalText;


    input.style.height =
      "auto";


    input.style.height =
      Math.min(
        input.scrollHeight,
        200
      ) + "px";


    /*
     * Show the actual error in the UI.
     */

    const errorWrap =
      document.createElement("div");


    errorWrap.className =
      "msg assistant";


    const avatar =
      document.createElement("div");


    avatar.className =
      "avatar";


    avatar.textContent =
      "AM";


    const body =
      document.createElement("div");


    body.className =
      "msg-body";


    const textEl =
      document.createElement("div");


    textEl.className =
      "msg-text";


    textEl.textContent =
      "Error: " +
      errorMessage;


    body.appendChild(textEl);

    errorWrap.appendChild(avatar);

    errorWrap.appendChild(body);

    messagesEl.appendChild(errorWrap);


    console.error(
      "Detailed error:",
      {
        error,
        currentUser,
        currentChat,
        userMessageWasSaved
      }
    );


    scrollToBottom();

  }finally{

    sending = false;

    updateSendButton();

    scrollToBottom();

  }

}


/* =========================================================
   NEW CHAT
========================================================= */

newChatBtn.addEventListener(
  "click",
  async () => {

    if(sending){
      return;
    }


    try{

      clearPendingImages();

      input.value = "";

      input.style.height =
        "auto";


      await createNewChat();

      input.focus();

    }catch(error){

      console.error(
        "New chat error:",
        error
      );


      alert(
        "Could not create chat:\n\n" +
        (
          error?.message ||
          "Unknown error"
        )
      );

    }

  }
);


/* =========================================================
   INITIAL STATE
========================================================= */

updateSendButton();
