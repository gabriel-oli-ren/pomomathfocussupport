<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fullscreen Game – Amazing Strange Rope Police</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }
  </style>
</head>
<body>
  <iframe
    id="game-container"
    src="https://www.gamearter.com/game/amazing-strange-rope-police-vice-spider-vegas/"
    allowfullscreen
    allow="autoplay; fullscreen; gamepad; xr-spatial-tracking"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-orientation-lock allow-pointer-lock allow-presentation"
  ></iframe>
</body>
</html>
