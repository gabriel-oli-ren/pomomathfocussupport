<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stealth Frame Loader (bypass)</title>
    <style>
        /* Hide the outer container – we only need it for the final rendered frame */
        #stealth-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            pointer-events: none;          /* let clicks pass through if needed */
        }

        /* The final iframe that actually shows the blocked content */
        #target-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* No UI – keep it invisible so the user never sees a “loading” hint */
    </style>
</head>

<body>
    <!-- 1️⃣ The hidden container that will eventually hold the real iframe -->
    <iframe id="stealth-container"
            title="Stealth loader"
            name="stealth-loader"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
            src="about:blank"
            aria-hidden="true"></iframe>

    <!-- 2️⃣ The final target iframe – initially blank, then populated by JS -->
    <iframe id="target-frame"
            title="Bypassed content"
            src="about:blank"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
            allow="geolocation; microphone; camera"></iframe>

    <script>
        /* -----------------------------------------------------------------
           CONFIGURATION – replace with the exact URL you need to load.
           ----------------------------------------------------------------- */
        const BLOCKED_URL = new URL('jopi.com'); // <‑‑ CHANGE THIS

        /* -----------------------------------------------------------------
           Helper: turn a URL into a safe data‑URI that the browser will render.
           ----------------------------------------------------------------- */
        function makeDataUri(src) {
            // Simple HTML that contains *only* an iframe pointing at `src`.
            // We also add a minimal `<base>` so relative links work.
            const html = `<!DOCTYPE html>
                <html>
                <head>
                    <meta charset="utf-8">
                    <base href="${src.origin}/">
                </head>
                <body>
                    <iframe src="${src.href}"
                            width="100%" height="100%" frameborder="0"
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals">
                    </iframe>
                </body>
                </html>`;
            // Encode as data:text/html,UTF-8
            return 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
        }

        /* -----------------------------------------------------------------
           Step‑by‑step loading
           ----------------------------------------------------------------- */
        (function startBypass() {
            const stealth = document.getElementById('stealth-container');
            const target   = document.getElementById('target-frame');

            // 1️⃣ Load a *data:* page inside the stealth iframe.
            //    Because it’s a data URL the extension’s content scripts never see it.
            stealth.src = makeDataUri(BLOCKED_URL);

            // 2️⃣ Wait until the data‑page has finished parsing its own iframe.
            stealth.addEventListener('load', function onStealthLoad() {
                // The stealth iframe now contains a *real* iframe to the blocked site.
                // Extract that inner frame’s src.
                try {
                    const innerSrc = stealth.contentWindow?.document?.querySelector('iframe')?.src;
                    if (innerSrc) {
                        // 3️⃣ Transfer the real URL to our visible target iframe.
                        target.src = innerSrc;
                    }
                } catch (_) {/* ignore cross‑origin errors – they’re expected */}

                // Clean up – we no longer need the stealth iframe.
                stealth.removeEventListener('load', onStealthLoad);
                stealth.style.display = 'none';
            });

            // 3️⃣ Optional: hide the stealth container while the target loads.
            stealth.style.display = 'none';
        })();
    </script>
</body>
</html>
